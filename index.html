<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Livro — Flipbook</title>

<style>
  * { box-sizing: border-box; }

  :root {
    --paper: #f2eee5;
    --background: #151515;
    --text: #e9e5dc;
    --page-width: min(42vw, 620px);
    --page-height: min(60vw, 860px);
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--background);
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
  }

  body {
    display: flex;
    flex-direction: column;
    user-select: none;
    -webkit-user-select: none;
  }

  header {
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    font-family: Arial, sans-serif;
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    flex-shrink: 0;
  }

  #book-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 2200px;
    min-height: 0;
    padding: 20px;
  }

  #book {
    position: relative;
    width: calc(var(--page-width) * 2);
    height: var(--page-height);
    max-width: 94vw;
    transform-style: preserve-3d;
    cursor: pointer;
  }

  .spread {
    position: absolute;
    inset: 0;
    display: flex;
    transform-style: preserve-3d;
    filter: drop-shadow(0 20px 30px rgba(0,0,0,.45));
  }

  .page {
    position: relative;
    width: 50%;
    height: 100%;
    overflow: hidden;
    background: var(--paper);
    color: #161616;
    backface-visibility: hidden;
    transform-style: preserve-3d;
  }

  .page.left {
    border-radius: 4px 0 0 4px;
    box-shadow: inset -10px 0 18px rgba(0,0,0,.08);
  }

  .page.right {
    border-radius: 0 4px 4px 0;
    box-shadow: inset 10px 0 18px rgba(0,0,0,.08);
  }

  .page img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    pointer-events: none;
  }

  /* Página virando */
  .turning-page {
    position: absolute;
    top: 0;
    width: 50%;
    height: 100%;
    z-index: 20;
    transform-style: preserve-3d;
    transition: transform 800ms cubic-bezier(.22,.61,.36,1);
    box-shadow: 0 10px 25px rgba(0,0,0,.25);
  }

  .turning-page.next {
    right: 0;
    left: auto;
    transform-origin: left center;
  }

  .turning-page.prev {
    left: 0;
    transform-origin: right center;
  }

  .face {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background: var(--paper);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }

  .face img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    pointer-events: none;
  }

  .face.back {
    transform: rotateY(180deg);
  }

  .turning-page.next.flipped {
    transform: rotateY(-180deg);
  }

  .turning-page.prev.flipped {
    transform: rotateY(180deg);
  }

  .book-shadow {
    position: absolute;
    z-index: -1;
    left: 50%;
    top: 0;
    width: 2px;
    height: 100%;
    background: rgba(0,0,0,.18);
    box-shadow: 0 0 30px 12px rgba(0,0,0,.22);
  }

  #controls {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    flex-shrink: 0;
    font-family: Arial, sans-serif;
  }

  button {
    border: 1px solid #555;
    background: transparent;
    color: var(--text);
    padding: 10px 16px;
    cursor: pointer;
    font: inherit;
    transition: .2s;
    border-radius: 2px;
  }

  button:hover:not(:disabled) {
    background: #eee;
    color: #111;
  }

  button:disabled {
    opacity: .25;
    cursor: default;
  }

  #counter {
    min-width: 90px;
    text-align: center;
    font-size: 13px;
    letter-spacing: .08em;
  }

  #hint {
    position: fixed;
    bottom: 82px;
    left: 50%;
    transform: translateX(-50%);
    opacity: .45;
    font-family: Arial, sans-serif;
    font-size: 11px;
    pointer-events: none;
  }

  /* Celular */
  @media (max-width: 800px) {
    :root {
      --page-width: min(88vw, 420px);
      --page-height: min(130vw, 650px);
    }

    header {
      padding: 0 12px;
    }

    #book-area {
      padding: 10px;
    }

    #book {
      width: var(--page-width);
      height: var(--page-height);
    }

    .page.left {
      display: none !important;
    }

    .page.right {
      width: 100%;
      border-radius: 4px;
    }

    .turning-page {
      width: 100%;
    }

    .turning-page.next {
      width: 100%;
    }

    .turning-page.prev {
      width: 100%;
    }

    .book-shadow {
      display: none;
    }

    #hint {
      display: none;
    }
  }
</style>
</head>

<body>

<header>
  <div id="title">MEU LIVRO</div>
  <button id="fullscreen">Tela cheia</button>
</header>

<main id="book-area">
  <div id="book">
    <div class="book-shadow"></div>

    <div class="spread">
      <div class="page left" id="left-container">
        <img id="left-page" alt="Página esquerda">
      </div>

      <div class="page right" id="right-container">
        <img id="right-page" alt="Página direita">
      </div>
    </div>
  </div>
</main>

<div id="hint">clique nas páginas ou use as setas ← →</div>

<nav id="controls">
  <button id="prev" aria-label="Página anterior">←</button>
  <div id="counter">1 / 17</div>
  <button id="next" aria-label="Próxima página">→</button>
</nav>

<script>
/*
  ==========================================================
  CONFIGURAÇÃO DO LIVRO
  ==========================================================

  Coloque suas 17 imagens na pasta "paginas":

  paginas/
    pagina-01.jpg
    pagina-02.jpg
    pagina-03.jpg
    ...
    pagina-17.jpg

  Se suas imagens usarem outra extensão (ex: .png ou .webp),
  altere a função pageFile abaixo.
*/

const NUM_PAGES = 15;

// Cache da extensão detectada para cada página
const detectedExtensions = {};

// Retorna o caminho da imagem aceitando .png, .jpg ou .jpeg
function pageFile(number, forcedExt) {
  const num = String(number).padStart(2, "0");
  const ext = forcedExt || detectedExtensions[number] || "png";
  return `paginas/pagina-${num}.${ext}`;
}

// ==========================================================
// LÓGICA DO FLIPBOOK
// ==========================================================

let current = 1;
let animating = false;

const leftPage = document.getElementById("left-page");
const rightPage = document.getElementById("right-page");
const leftContainer = document.getElementById("left-container");
const rightContainer = document.getElementById("right-container");
const book = document.getElementById("book");

const prevButton = document.getElementById("prev");
const nextButton = document.getElementById("next");
const counter = document.getElementById("counter");
const fullscreenButton = document.getElementById("fullscreen");

// Atribui imagem a um elemento com fallback automático (tenta .png -> .jpg -> .jpeg)
function loadPageImage(imgEl, number) {
  if (!imgEl) return;
  if (!number || number < 1 || number > NUM_PAGES) {
    imgEl.style.visibility = "hidden";
    imgEl.removeAttribute("src");
    return;
  }

  const num = String(number).padStart(2, "0");
  imgEl.style.visibility = "visible";

  imgEl.onerror = function () {
    if (this.src.endsWith(".png")) {
      this.src = `paginas/pagina-${num}.jpg`;
    } else if (this.src.endsWith(".jpg")) {
      this.src = `paginas/pagina-${num}.jpeg`;
    } else {
      this.onerror = null;
    }
  };

  imgEl.onload = function () {
    if (this.src.endsWith(".png")) detectedExtensions[number] = "png";
    else if (this.src.endsWith(".jpg")) detectedExtensions[number] = "jpg";
    else if (this.src.endsWith(".jpeg")) detectedExtensions[number] = "jpeg";
  };

  imgEl.src = pageFile(number);
}

// Gera o HTML da imagem para a folha que vira (com fallback automático)
function turningImg(number) {
  if (number < 1 || number > NUM_PAGES) return "";
  const num = String(number).padStart(2, "0");
  const initial = pageFile(number);
  return `<img src="${initial}" onerror="if(this.src.endsWith('.png')){this.src='paginas/pagina-${num}.jpg'}else if(this.src.endsWith('.jpg')){this.src='paginas/pagina-${num}.jpeg'}">`;
}

function getSpread(curr) {
  const isMobile = window.innerWidth <= 800;
  if (isMobile) {
    return { left: 0, right: curr };
  }
  const left = curr % 2 === 0 ? curr : curr - 1;
  const right = left + 1;
  return { left, right };
}

function updateSpread() {
  const isMobile = window.innerWidth <= 800;

  if (isMobile) {
    leftContainer.style.display = "none";
    rightContainer.style.display = "block";
    loadPageImage(rightPage, current);
    counter.textContent = `${current} / ${NUM_PAGES}`;

    prevButton.disabled = current <= 1;
    nextButton.disabled = current >= NUM_PAGES;
  } else {
    const { left, right } = getSpread(current);

    leftContainer.style.display = "block";
    rightContainer.style.display = "block";

    loadPageImage(leftPage, left);
    loadPageImage(rightPage, right);

    if (left <= 0) {
      counter.textContent = `1 / ${NUM_PAGES}`;
    } else {
      counter.textContent = `${left}-${Math.min(right, NUM_PAGES)} / ${NUM_PAGES}`;
    }

    prevButton.disabled = current <= 1;
    nextButton.disabled = (left > 0 ? Math.max(left, right) : right) >= NUM_PAGES;
  }
}

function nextPage() {
  if (animating) return;

  const isMobile = window.innerWidth <= 800;

  if (isMobile) {
    if (current >= NUM_PAGES) return;
    animating = true;
    current++;
    updateSpread();
    setTimeout(() => { animating = false; }, 300);
  } else {
    const { left, right } = getSpread(current);
    if (right >= NUM_PAGES) return;

    animating = true;

    const turning = document.createElement("div");
    turning.className = "turning-page next";

    // A folha que está virando é a página da direita
    // Frente: a página que já estava visível (right)
    // Verso: a página seguinte que aparecerá à esquerda (right + 1)
    turning.innerHTML = `
      <div class="face front">
        ${turningImg(right)}
      </div>
      <div class="face back">
        ${turningImg(right + 1)}
      </div>
    `;

    // Por baixo da folha na direita, já prepara a próxima página (right + 2)
    loadPageImage(rightPage, right + 2);

    book.appendChild(turning);

    requestAnimationFrame(() => {
      turning.classList.add("flipped");
    });

    setTimeout(() => {
      current = Math.min(right + 2, NUM_PAGES);
      turning.remove();
      updateSpread();
      animating = false;
    }, 820);
  }
}

function prevPage() {
  if (animating) return;

  const isMobile = window.innerWidth <= 800;

  if (isMobile) {
    if (current <= 1) return;
    animating = true;
    current--;
    updateSpread();
    setTimeout(() => { animating = false; }, 300);
  } else {
    const { left, right } = getSpread(current);
    if (left <= 0) return;

    animating = true;

    const turning = document.createElement("div");
    turning.className = "turning-page prev";

    // A folha que está voltando é a página da esquerda
    // Frente: a página que estava visível à esquerda (left)
    // Verso: a página que voltará a ficar visível à direita (left - 1)
    turning.innerHTML = `
      <div class="face front">
        ${turningImg(left)}
      </div>
      <div class="face back">
        ${turningImg(left - 1)}
      </div>
    `;

    // Por baixo da folha na esquerda, já prepara a página anterior (left - 2)
    loadPageImage(leftPage, left - 2);

    book.appendChild(turning);

    requestAnimationFrame(() => {
      turning.classList.add("flipped");
    });

    setTimeout(() => {
      current = Math.max(left - 1, 1);
      turning.remove();
      updateSpread();
      animating = false;
    }, 820);
  }
}

nextButton.addEventListener("click", nextPage);
prevButton.addEventListener("click", prevPage);

// Clique na metade do livro
book.addEventListener("click", (event) => {
  if (animating) return;
  const rect = book.getBoundingClientRect();
  const x = event.clientX - rect.left;

  if (x > rect.width / 2) {
    nextPage();
  } else {
    prevPage();
  }
});

// Navegação por teclado
document.addEventListener("keydown", (event) => {
  if (event.key === "ArrowRight" || event.key === " ") {
    event.preventDefault();
    nextPage();
  } else if (event.key === "ArrowLeft") {
    event.preventDefault();
    prevPage();
  } else if (event.key.toLowerCase() === "f") {
    toggleFullscreen();
  }
});

// Suporte a gestos touch (swipe) para celulares e tablets
let touchStartX = 0;
let touchEndX = 0;

book.addEventListener("touchstart", (e) => {
  touchStartX = e.changedTouches[0].screenX;
}, { passive: true });

book.addEventListener("touchend", (e) => {
  touchEndX = e.changedTouches[0].screenX;
  const diff = touchEndX - touchStartX;
  if (Math.abs(diff) > 45) {
    if (diff < 0) {
      nextPage();
    } else {
      prevPage();
    }
  }
}, { passive: true });

// Tela cheia
function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen?.();
  } else {
    document.exitFullscreen?.();
  }
}

fullscreenButton.addEventListener("click", toggleFullscreen);

// Redimensionamento / Rotação de tela
window.addEventListener("resize", updateSpread);

// Inicialização
updateSpread();
</script>

</body>
</html>
